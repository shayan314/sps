<script>

const formatDate = d => { try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d} };
const subjectColors = {MATH:'bg-teal-100 text-teal-800',SCI:'bg-blue-100 text-blue-800',ENG:'bg-indigo-100 text-indigo-800',HIN:'bg-amber-100 text-amber-800',SST:'bg-emerald-100 text-emerald-800'};
function getGrade(marks,max){const p=((marks/max)*100);if(p>=90)return'A+';if(p>=80)return'A';if(p>=70)return'B+';if(p>=60)return'B';if(p>=50)return'C';if(p>=40)return'D';return'F'}
function getInitials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}

// ==================== FIREBASE STORE ====================
// Ye poora localStorage ko replace karta hai
// Har function async hai kyunki Firestore network call karta hai

const FStore = {
  // ---- READ ----
  async getCollection(colName) {
    try {
      const snap = await db.collection(colName).get();
      return snap.docs.map(d => ({id: d.id, ...d.data()}));
    } catch(e) {
      console.error(`Error reading ${colName}:`, e);
      toast(`Failed to load ${colName}`, 'error');
      return [];
    }
  },

  async getDoc(colName, docId) {
    try {
      const doc = await db.collection(colName).doc(docId).get();
      return doc.exists ? {id: doc.id, ...doc.data()} : null;
    } catch(e) { return null; }
  },

  async queryWhere(colName, field, op, value) {
    try {
      const snap = await db.collection(colName).where(field, op, value).get();
      return snap.docs.map(d => ({id: d.id, ...d.data()}));
    } catch(e) { return []; }
  },

  // ---- WRITE ----
  async addDoc(colName, data) {
    try {
      const ref = await db.collection(colName).add(data);
      return ref.id;
    } catch(e) {
      console.error(`Error adding to ${colName}:`, e);
      toast('Failed to save data', 'error');
      return null;
    }
  },

  async setDoc(colName, docId, data) {
    try {
      await db.collection(colName).doc(docId).set(data, {merge: true});
      return true;
    } catch(e) {
      console.error(`Error updating ${colName}:`, e);
      toast('Failed to update data', 'error');
      return false;
    }
  },

  async deleteDoc(colName, docId) {
    try {
      await db.collection(colName).doc(docId).delete();
      return true;
    } catch(e) {
      toast('Failed to delete', 'error');
      return false;
    }
  },

  async deleteWhere(colName, field, op, value) {
    try {
      const snap = await db.collection(colName).where(field, op, value).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      return snap.size;
    } catch(e) { return 0; }
  },

  // ---- CHECK INIT ----
  async isInitialized() {
    const meta = await this.getDoc('_meta', 'init');
    return meta && meta.done === true;
  },

  async markInitialized() {
    await db.collection('_meta').doc('init').set({done: true});
  }
};

// ==================== LOCAL CACHE (speed ke liye) ====================
// Firebase se ek baar load karo, phir local cache use karo
// Write hote hi dono jagah update karo
const Cache = {
  _data: {},
  set(key, val) { this._data[key] = val; },
  get(key) { return this._data[key] || null; },
  clear() { this._data = {}; }
};

// Helper: Firebase se load karo cache mein
async function loadCache() {
  const [users, subjects, classes, timetable, attendance, grades] = await Promise.all([
    FStore.getCollection('users'),
    FStore.getCollection('subjects'),
    FStore.getCollection('classes'),
    FStore.getCollection('timetable'),
    FStore.getCollection('attendance'),
    FStore.getCollection('grades')
  ]);
  Cache.set('users', users);
  Cache.set('subjects', subjects);
  Cache.set('classes', classes);
  Cache.set('timetable', timetable);
  Cache.set('attendance', attendance);
  Cache.set('grades', grades);
}

// Helper: Cache se read karo (sync)
function getUsers() { return Cache.get('users') || []; }
function getSubjects() { return Cache.get('subjects') || []; }
function getClasses() { return Cache.get('classes') || []; }
function getTimetable() { return Cache.get('timetable') || []; }
function getAttendance() { return Cache.get('attendance') || []; }
function getGrades() { return Cache.get('grades') || []; }

// Helper: Cache + Firebase dono mein update karo
async function saveUser(user) {
  const {id, ...data} = user;
  // Remove undefined fields
  Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
  await FStore.setDoc('users', id, data);
  const users = getUsers();
  const idx = users.findIndex(u => u.id === id);
  if (idx >= 0) users[idx] = user; else users.push(user);
  Cache.set('users', users);
}
async function removeUser(id) {
  await FStore.deleteDoc('users', id);
  Cache.set('users', getUsers().filter(u => u.id !== id));
}
async function saveClass(cls) {
  const {id, ...data} = cls;
  Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
  await FStore.setDoc('classes', id, data);
  const classes = getClasses();
  const idx = classes.findIndex(c => c.id === id);
  if (idx >= 0) classes[idx] = cls; else classes.push(cls);
  Cache.set('classes', classes);
}
async function removeClass(id) {
  await FStore.deleteDoc('classes', id);
  Cache.set('classes', getClasses().filter(c => c.id !== id));
}
async function saveAttendance(records) {
  // Batch write for performance
  const batch = db.batch();
  records.forEach(r => {
    const {id, ...data} = r;
    Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
    batch.set(db.collection('attendance').doc(id), data, {merge: true});
  });
  await batch.commit();
  // Update cache
  const existing = getAttendance();
  records.forEach(r => {
    const idx = existing.findIndex(e => e.id === r.id);
    if (idx >= 0) existing[idx] = r; else existing.push(r);
  });
  Cache.set('attendance', existing);
}
async function saveGrades(records) {
  const batch = db.batch();
  records.forEach(r => {
    const {id, ...data} = r;
    Object.keys(data).forEach(k => data[k] === undefined && delete data[k]);
    batch.set(db.collection('grades').doc(id), data, {merge: true});
  });
  await batch.commit();
  const existing = getGrades();
  records.forEach(r => {
    const idx = existing.findIndex(e => e.id === r.id);
    if (idx >= 0) existing[idx] = r; else existing.push(r);
  });
  Cache.set('grades', existing);
}
async function removeStudentData(studentId) {
  await FStore.deleteWhere('attendance', 'studentId', '==', studentId);
  await FStore.deleteWhere('grades', 'studentId', '==', studentId);
  const att = getAttendance().filter(a => a.studentId !== studentId);
  const gr = getGrades().filter(g => g.studentId !== studentId);
  Cache.set('attendance', att);
  Cache.set('grades', gr);
}

        classId:cls.id, rollNo:si+1, dob:`200${10-ci}-${String(3+si*2).padStart(2,'0')}`,
        gender:genders[si], parentName:'Mr. '+sname.split(' ')[1], parentPhone:'9'+String(Math.floor(Math.random()*900000000+100000000)),
        address:`${Math.floor(Math.random()*200+1)}, Sector ${Math.floor(Math.random()*50+1)}, New Delhi`
      });
      uid++;
    });
  });

  // Timetable
  const tt = [];
  const subIds = subjects.map(s => s.id);
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  classes.forEach(cls => {
    days.forEach(day => {
      for(let p=1; p<=6; p++){
        const si = (p + days.indexOf(day)*3 + classes.indexOf(cls)) % subIds.length;
        tt.push({id:genId(), classId:cls.id, day, period:p, subjectId:subIds[si]});
      }
    });
  });

  // Attendance (past 25 working days)
  const att = [];
  const students = users.filter(u => u.role === 'student');
  let d = new Date(); d.setDate(d.getDate() - 35);
  for(let i=0; i<25; i++){
    d.setDate(d.getDate()+1);
    if(d.getDay()===0 || d.getDay()===6) continue;
    const dateStr = d.toISOString().split('T')[0];
    students.forEach(st => {
      const r = Math.random();
      att.push({id:genId(), date:dateStr, classId:st.classId, studentId:st.id, status: r<.82?'present':r<.94?'absent':'late'});
    });
  }

  // Grades
  const grades = [];
  ['Mid-Term','Unit Test 1'].forEach(exam => {
    students.forEach(st => {
      subjects.forEach(sub => {
        const max = exam==='Mid-Term'?100:25;
        const marks = Math.floor(Math.random()*(max*.55)+max*.4);
        grades.push({id:genId(), studentId:st.id, classId:st.classId, subjectId:sub.id, examType:exam, marks, maxMarks:max});
      });
    });
  });

  // Batch write sab collections
  $('loading-text').textContent = 'Writing data to Firestore...';

  // Users ko chunks mein likho (Firestore batch limit = 500)
  const chunkSize = 400;
  for(let i=0; i<users.length; i+=chunkSize){
    const batch = db.batch();
    const chunk = users.slice(i, i+chunkSize);
    chunk.forEach(u => {
      const {id, ...data} = u;
      batch.set(db.collection('users').doc(id), data);
    });
    await batch.commit();
  }

  // Subjects batch
  let batch = db.batch();
  subjects.forEach(s => { const {id,...d}=s; batch.set(db.collection('subjects').doc(id),d); });
  await batch.commit();

  // Classes batch
  batch = db.batch();
  classes.forEach(c => { const {id,...d}=c; batch.set(db.collection('classes').doc(id),d); });
  await batch.commit();

  // Timetable chunks
  for(let i=0; i<tt.length; i+=chunkSize){
    batch = db.batch();
    tt.slice(i,i+chunkSize).forEach(t => { const {id,...d}=t; batch.set(db.collection('timetable').doc(id),d); });
    await batch.commit();
  }

  // Attendance chunks
  for(let i=0; i<att.length; i+=chunkSize){
    batch = db.batch();
    att.slice(i,i+chunkSize).forEach(a => { const {id,...d}=a; batch.set(db.collection('attendance').doc(id),d); });
    await batch.commit();
  }

  // Grades chunks
  for(let i=0; i<grades.length; i+=chunkSize){
    batch = db.batch();
    grades.slice(i,i+chunkSize).forEach(g => { const {id,...d}=g; batch.set(db.collection('grades').doc(id),d); });
    await batch.commit();
  }

  // Local cache bhi bhar do
  Cache.set('users', users);
  Cache.set('subjects', subjects);
  Cache.set('classes', classes);
  Cache.set('timetable', tt);
  Cache.set('attendance', att);
  Cache.set('grades', grades);

  await FStore.markInitialized();
}

const Auth = {
  user: null,
  login(u, p) {
    const users = getUsers();
    const found = users.find(x => x.username === u && x.password === p);
    if (!found) return false;
    this.user = found;
    sessionStorage.setItem('sps_session', found.id);
    return true;
  },
  logout() { this.user = null; sessionStorage.removeItem('sps_session'); },
  restore() {
    const sid = sessionStorage.getItem('sps_session');
    if (!sid) return false;
    const found = getUsers().find(x => x.id === sid);
    if (found) { this.user = found; return true; }
    return false;
  },
  refreshUser() {
    const found = getUsers().find(x => x.id === this.user.id);
    if (found) this.user = found;
  }
};

ViewHooks['teacher-attendance'] = () => loadTeacherAtt();
function loadTeacherAtt() {
  const clsId=$('t-att-cls')?.value;const date=$('t-att-date')?.value;if(!clsId)return;
  const att=getAttendance();const students=getUsers().filter(u=>u.role==='student'&&u.classId===clsId).sort((a,b)=>a.rollNo-b.rollNo);
  const existing=att.filter(a=>a.classId===clsId&&a.date===date);
  let html=`<div class="p-4 border-b border-slate-100"><p class="text-sm text-slate-500">${existing.length?'Update attendance:':'Mark attendance for each student'}</p></div><div class="overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-slate-100 bg-slate-50/50"><th class="px-5 py-3.5 text-left text-[11px] font-semibold text-slate-500 uppercase">Roll</th><th class="px-5 py-3.5 text-left text-[11px] font-semibold text-slate-500 uppercase">Student</th><th class="px-5 py-3.5 text-center text-[11px] font-semibold text-slate-500 uppercase">Present</th><th class="px-5 py-3.5 text-center text-[11px] font-semibold text-slate-500 uppercase">Absent</th><th class="px-5 py-3.5 text-center text-[11px] font-semibold text-slate-500 uppercase">Late</th></tr></thead><tbody class="divide-y divide-slate-50">`;
  students.forEach(s=>{const rec=existing.find(a=>a.studentId===s.id);const st=rec?.status||'present';
    html+=`<tr class="data-row"><td class="px-5 py-3 text-sm text-slate-500">${s.rollNo}</td><td class="px-5 py-3"><div class="flex items-center gap-3">${avatarCircle(s.name)}<span class="text-sm font-medium text-slate-800">${s.name}</span></div></td>
    <td class="px-5 py-3 text-center"><input type="radio" name="att-${s.id}" value="present" ${st==='present'?'checked':''} class="att-radio"></td>
    <td class="px-5 py-3 text-center"><input type="radio" name="att-${s.id}" value="absent" ${st==='absent'?'checked':''} class="att-radio absent"></td>
    <td class="px-5 py-3 text-center"><input type="radio" name="att-${s.id}" value="late" ${st==='late'?'checked':''} class="att-radio late"></td></tr>`;});
  html+=`</tbody></table></div><div class="p-4 border-t border-slate-100 flex justify-end"><button onclick="saveTeacherAtt()" class="px-6 py-2.5 rounded-lg bg-primary-600 text-white text-sm font-semibold hover:bg-primary-700 transition-colors"><i class="fas fa-save mr-2"></i>Save Attendance</button></div>`;
  $('t-att-form').innerHTML=html;
}
async function saveTeacherAtt() {
  const clsId=$('t-att-cls')?.value;const date=$('t-att-date')?.value;if(!clsId||!date)return;
  const students=getUsers().filter(u=>u.role==='student'&&u.classId===clsId);
  const records=students.map(s=>{const val=document.querySelector(`input[name="att-${s.id}"]:checked`)?.value||'present';
    const existing=getAttendance().find(a=>a.classId===clsId&&a.date===date&&a.studentId===s.id);
    return existing?{...existing,status:val}:{id:genId(),date,classId:clsId,studentId:s.id,status:val};});
  await saveAttendance(records);toast('Attendance saved to Firebase');loadTeacherAtt();
}

ViewHooks['teacher-grades'] = () => loadTeacherGrades();
function loadTeacherGrades() {
  const clsId=$('t-gr-cls')?.value;const exam=$('t-gr-exam')?.value;if(!clsId)return;
  const u=Auth.user;const subjects=getSubjects().filter(s=>(u.subjects||[]).includes(s.id));
  const students=getUsers().filter(s=>s.role==='student'&&s.classId===clsId).sort((a,b)=>a.rollNo-b.rollNo);
  const maxM=exam?.includes('Unit')?25:100;
  let html=`<div class="overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-slate-100 bg-slate-50/50"><th class="px-4 py-3.5 text-left text-[11px] font-semibold text-slate-500 uppercase">Student</th>${subjects.map(s=>`<th class="px-4 py-3.5 text-center text-[11px] font-semibold text-slate-500 uppercase">${s.code}<br><span class="font-normal text-slate-400">(Max: ${maxM})</span></th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-50">`;
  students.forEach(st=>{html+=`<tr class="data-row"><td class="px-4 py-3"><div class="flex items-center gap-2">${avatarCircle(st.name,'w-7 h-7 text-[10px]')}<span class="text-sm font-medium text-slate-800">${st.name}</span></div></td>`;
    subjects.forEach(sub=>{const g=getGrades().find(x=>x.studentId===st.id&&x.subjectId===sub.id&&x.examType===exam);
      html+=`<td class="px-4 py-2 text-center"><input type="number" min="0" max="${maxM}" value="${g?.marks||''}" data-student="${st.id}" data-subject="${sub.id}" class="w-16 px-2 py-1.5 rounded border border-slate-200 text-sm text-center font-medium"></td>`;});
    html+='</tr>';});
  html+=`</tbody></table></div><div class="p-4 border-t border-slate-100 flex justify-end"><button onclick="saveTeacherGrades('${exam}',${maxM})" class="px-6 py-2.5 rounded-lg bg-primary-600 text-white text-sm font-semibold hover:bg-primary-700 transition-colors"><i class="fas fa-save mr-2"></i>Save Grades</button></div>`;
  $('t-gr-form').innerHTML=html;
}
async function saveTeacherGrades(exam,maxM) {
  const clsId=$('t-gr-cls')?.value;if(!clsId)return;
  const inputs=$('t-gr-form').querySelectorAll('input[type="number"]');const records=[];
  inputs.forEach(inp=>{const sid=inp.dataset.student;const subId=inp.dataset.subject;const marks=parseInt(inp.value);if(isNaN(marks))return;
    const existing=getGrades().find(x=>x.studentId===sid&&x.subjectId===subId&&x.examType===exam&&x.classId===clsId);
    if(existing)records.push({...existing,marks});else records.push({id:genId(),studentId:sid,classId:clsId,subjectId:subId,examType:exam,marks,maxMarks:maxM});});
  if(records.length)await saveGrades(records);toast('Grades saved to Firebase');
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPS School Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        .chart-wrapper { position: relative; height: 250px; width: 100%; }
        @media (max-width: 768px) { .chart-wrapper { height: 180px; } }
        .print-only { display: none; }
        @media print { .no-print { display: none; } .print-only { display: block; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Loading Screen -->
    <div id="lo" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="animate-spin h-10 w-10 border-4 border-teal-600 border-t-transparent rounded-full mx-auto"></div>
            <p class="mt-4 font-bold text-slate-600" id="lt">Loading System...</p>
        </div>
    </div>

    <!-- Sidebar & Dashboard -->
    <div id="app" class="hidden">
        <div class="min-h-screen flex">
            <!-- Sidebar -->
            <aside id="sidebar" class="w-64 bg-slate-900 text-white p-6 no-print">
                <h1 class="text-2xl font-bold text-teal-400 mb-8">SPS System</h1>
                <nav id="nav-links" class="space-y-4">
                    <button onclick="renderView('dashboard')" class="block w-full text-left hover:text-teal-400">Dashboard</button>
                    <button onclick="renderView('students')" class="block w-full text-left hover:text-teal-400">Manage Students</button>
                    <button onclick="renderView('fees')" class="block w-full text-left hover:text-teal-400">Fee Management</button>
                    <button onclick="renderView('results')" class="block w-full text-left hover:text-teal-400">Results & Marks</button>
                </nav>
            </aside>
            
            <!-- Content -->
            <main class="flex-1 p-8">
                <div id="main-content"></div>
            </main>
        </div>
    </div>

    <script>
        // Professional Config
        const firebaseConfig = { 
            /* Yahan apni config dalain */ 
            apiKey: "AIzaSy...", projectId: "sps-school-management-96f68", 
            authDomain: "sps-school-management-96f68.firebaseapp.com",
            storageBucket: "sps-school-management-96f68.firebasestorage.app",
            messagingSenderId: "57272480045", appId: "1:57272480045:web:403763647ee171f2f263a4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Data Seeding with Pakistani Names
        async function seedData() {
            const students = [
                { name: "Ali Ahmed", roll: 101, class: "8-A" },
                { name: "Fatima Noor", roll: 102, class: "8-A" },
                { name: "Muhammad Usman", roll: 103, class: "9-A" }
            ];
            // Batch write logic here...
        }

        // View Renderer
        function renderView(view) {
            const content = document.getElementById('main-content');
            if(view === 'dashboard') {
                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow">
                            <h3 class="text-sm text-slate-500">Total Students</h3>
                            <p class="text-2xl font-bold">150</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow col-span-2">
                            <div class="chart-wrapper"><canvas id="mainChart"></canvas></div>
                        </div>
                    </div>
                `;
                initCharts();
            } else if (view === 'fees') {
                content.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow">
                        <h2 class="text-xl font-bold mb-4">Fee Collection</h2>
                        <button onclick="generateVoucher()" class="bg-teal-600 text-white px-4 py-2 rounded">Generate Voucher</button>
                    </div>
                `;
            }
        }

        function generateVoucher() {
            const printContent = `
                <div class="print-only p-10 border border-black">
                    <h1 class="text-3xl font-bold text-center">SPS SCHOOL FEE VOUCHER</h1>
                    <div class="mt-10">Name: Ali Ahmed | Fee: Rs 5000</div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', printContent);
            window.print();
        }

        function initCharts() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: { labels: ['Class 8', 'Class 9', 'Class 10'], datasets: [{ data: [40, 35, 30], backgroundColor: '#0D9488' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        window.onload = async () => {
            // Initialization
            document.getElementById('lo').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            renderView('dashboard');
        };
    </script>
</body>
</html>

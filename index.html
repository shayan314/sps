<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPS School Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100">

    <div id="loader" class="fixed inset-0 bg-white flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-teal-600"></div>
        <p id="load-text" class="mt-4 text-slate-600">Initializing...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAP5AkY5YMzMPuqf21-NmL6IIZZkzcE1CA",
            projectId: "sps-school-management-96f68",
            storageBucket: "sps-school-management-96f68.firebasestorage.app",
            messagingSenderId: "57272480045",
            appId: "1:57272480045:web:403763647ee171f2f263a4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function seedData() {
            const status = document.getElementById('load-text');
            status.textContent = "Creating Demo Students and Teachers...";

            // Demo Data
            const subjects = [{id:'SUB001',name:'Mathematics',code:'MATH'}, {id:'SUB002',name:'Science',code:'SCI'}];
            const users = [
                {id:'USR001',username:'admin',password:'admin123',role:'admin',name:'Dr. Muhammad Ashraf'},
                {id:'USR002',username:'ahmed.khan',password:'student123',role:'student',name:'Ahmed Khan',classId:'CLS001',rollNo:1}
            ];

            const batch = db.batch();
            subjects.forEach(s => batch.set(db.collection('subjects').doc(s.id), s));
            users.forEach(u => batch.set(db.collection('users').doc(u.id), u));
            await batch.commit();
            
            await db.collection('_meta').doc('init').set({done: true});
        }

        async function init() {
            try {
                const doc = await db.collection('_meta').doc('init').get();
                if (!doc.exists) {
                    await seedData();
                }
                document.getElementById('loader').classList.add('hidden');
                console.log("System Ready with Data.");
            } catch (error) {
                document.getElementById('load-text').textContent = "Error loading data!";
                console.error(error);
            }
        }

        window.onload = init;
    </script>
</body>
</html>

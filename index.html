<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SPS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div id="loader" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:9999;">
        <p>Loading system...</p>
    </div>

    <div id="app" style="display:none; padding: 20px;">
        <h1 class="text-xl font-bold">System Loaded Successfully</h1>
        <div id="content"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAP5AkY5YMzMPuqf21-NmL6IIZZkzcE1CA",
            projectId: "sps-school-management-96f68",
            storageBucket: "sps-school-management-96f68.firebasestorage.app",
            messagingSenderId: "57272480045",
            appId: "1:57272480045:web:403763647ee171f2f263a4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function init() {
            try {
                // Test connectivity
                await db.collection('_meta').doc('init').get();
                
                // Show App, Hide Loader
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('content').innerHTML = "<p>Data connection successful!</p>";
                
            } catch (error) {
                document.body.innerHTML = "<h1>Error</h1><p>" + error.message + "</p>";
            }
        }

        window.onload = init;
    </script>
</body>
</html>

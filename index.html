<script>
const $=id=>document.getElementById(id),gI=()=>'_'+Math.random().toString(36).substr(2,9),tdy=()=>new Date().toISOString().split('T')[0],fD=d=>{try{return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}};
const SC={MATH:'bg-teal-100 text-teal-800',SCI:'bg-blue-100 text-blue-800',ENG:'bg-indigo-100 text-indigo-800',HIN:'bg-amber-100 text-amber-800',SST:'bg-emerald-100 text-emerald-800'};
function gG(m,x){const p=m/x*100;return p>=90?'A+':p>=80?'A':p>=70?'B+':p>=60?'B':p>=50?'C':p>=40?'D':'F'}
function gN(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}

const FS={async co(n){try{const s=await db.collection(n).get();return s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return[]}},async se(n,id,d){try{await db.collection(n).doc(id).set(d,{merge:true});return true}catch(e){return false}},async de(n,id){try{await db.collection(n).doc(id).delete();return true}catch(e){return false}},async dw(n,f,o,v){try{const s=await db.collection(n).where(f,o,v).get();const b=db.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();return s.size}catch(e){return 0}},async ini(){try{const d=await db.collection('_meta').doc('init').get();return d.exists&&d.data().done===true}catch(e){return false}},async mi(){await db.collection('_meta').doc('init').set({done:true})}};

const CA={_d:{},s(k,v){this._d[k]=v},g(k){return this._d[k]||null}};
async function lC(){const r=await Promise.all([FS.co('users'),FS.co('subjects'),FS.co('classes'),FS.co('timetable'),FS.co('attendance'),FS.co('grades')]);CA.s('users',r[0]);CA.s('subjects',r[1]);CA.s('classes',r[2]);CA.s('timetable',r[3]);CA.s('attendance',r[4]);CA.s('grades',r[5])}
function U(){return CA.g('users')||[]}function SU(){return CA.g('subjects')||[]}function CL(){return CA.g('classes')||[]}function TT(){return CA.g('timetable')||[]}function AT(){return CA.g('attendance')||[]}function GR(){return CA.g('grades')||[]}

async function wU(u){const{id,...d}=u;Object.keys(d).forEach(k=>d[k]===undefined&&delete d[k]);await FS.se('users',id,d);const a=U(),i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=u;else a.push(u);CA.s('users',a)}
async function rU(id){await FS.de('users',id);CA.s('users',U().filter(u=>u.id!==id))}
async function wC(c){const{id,...d}=c;Object.keys(d).forEach(k=>d[k]===undefined&&delete d[k]);await FS.se('classes',id,d);const a=CL(),i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=c;else a.push(c);CA.s('classes',a)}
async function rC(id){await FS.de('classes',id);CA.s('classes',CL().filter(c=>c.id!==id))}
async function wA(rs){const b=db.batch();rs.forEach(r=>{const{id,...d}=r;Object.keys(d).forEach(k=>d[k]===undefined&&delete d[k]);b.set(db.collection('attendance').doc(id),d,{merge:true})});await b.commit();const ex=AT();rs.forEach(r=>{const i=ex.findIndex(e=>e.id===r.id);if(i>=0)ex[i]=r;else ex.push(r)});CA.s('attendance',ex)}
async function wG(rs){const b=db.batch();rs.forEach(r=>{const{id,...d}=r;Object.keys(d).forEach(k=>d[k]===undefined&&delete d[k]);b.set(db.collection('grades').doc(id),d,{merge:true})});await b.commit();const ex=GR();rs.forEach(r=>{const i=ex.findIndex(e=>e.id===r.id);if(i>=0)ex[i]=r;else ex.push(r)});CA.s('grades',ex)}
async function rSD(sid){await FS.dw('attendance','studentId','==',sid);await FS.dw('grades','studentId','==',sid);CA.s('attendance',AT().filter(a=>a.studentId!==sid));CA.s('grades',GR().filter(g=>g.studentId!==sid))}

const Au={user:null,login(u,p){const f=U().find(x=>x.username===u&&x.password===p);if(!f)return false;this.user=f;sessionStorage.setItem('sps_s',f.id);return true},logout(){this.user=null;sessionStorage.removeItem('sps_s')},restore(){const s=sessionStorage.getItem('sps_s');if(!s)return false;const f=U().find(x=>x.id===s);if(f){this.user=f;return true}return false}};

function toa(m,t){const c={success:'bg-emerald-500',error:'bg-red-500',warning:'bg-amber-500'},ic={success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-triangle'},el=document.createElement('div');el.className='tst flex items-center gap-3 px-5 py-3 rounded-xl '+(c[t||'success'])+' text-white shadow-lg text-sm font-medium';el.innerHTML='<i class="fas '+(ic[t||'success'])+'"></i><span>'+m+'</span>';$('tct').appendChild(el);setTimeout(()=>el.remove(),3100)}

old text-slate-800">Total</td><td class="px-5 py-4 text-center text-sm font-bold text-slate-800">'+tm+'</td><td class="px-5 py-4 text-center text-sm font-bold text-slate-800">'+tx+'</td><td class="px-5 py-4 text-center text-sm font-bold '+(p>=60?'text-primary-600':'text-red-500')+'">'+p+'%</td><td class="px-5 py-4 text-center"><span class="text-xs font-semibold px-3 py-1 rounded-full '+(p>=80?'bg-emerald-100 text-emerald-700':p>=60?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700')+'">'+gG(tm,tx)+'</span></td></tr></tfoot></table>'}

// SEED DB
async function seedDB(){
  $('lt').textContent='Creating data...';
  const subjects=[{id:'SUB001',name:'Mathematics',code:'MATH'},{id:'SUB002',name:'Science',code:'SCI'},{id:'SUB003',name:'English',code:'ENG'},{id:'SUB004',name:'Hindi',code:'HIN'},{id:'SUB005',name:'Social Studies',code:'SST'}];
  const classes=[{id:'CLS001',name:'Class 8',section:'A',classTeacherId:'USR002'},{id:'CLS002',name:'Class 9',section:'A',classTeacherId:'USR003'},{id:'CLS003',name:'Class 10',section:'A',classTeacherId:'USR002'}];
  const sn=[['Aarav Sharma','Diya Patel','Arjun Reddy','Ananya Gupta','Rohan Singh','Kavya Nair'],['Vihaan Mehta','Ishika Joshi','Aditya Kumar','Sneha Iyer','Karthik Rao','Meera Pillai'],['Arjun Malhotra','Tanya Agarwal','Rishi Verma','Pooja Desai','Nikhil Chauhan','Shruti Bhatt']];
  const gn=['Male','Female','Male','Female','Male','Female'];
  const users=[{id:'USR001',username:'admin',password:'admin123',role:'admin',name:'Dr. Suresh Mishra'},{id:'USR002',username:'rajesh.kumar',password:'teacher123',role:'teacher',name:'Rajesh Kumar',subjects:['SUB001','SUB002'],classIds:['CLS001','CLS003'],qualification:'M.Sc, B.Ed'},{id:'USR003',username:'priya.sharma',password:'teacher123',role:'teacher',name:'Priya Sharma',subjects:['SUB003','SUB004'],classIds:['CLS001','CLS002'],qualification:'M.A, B.Ed'}];
  let uid=4;
  classes.forEach((cls,ci)=>{sn[ci].forEach((sname,si)=>{users.push({id:'USR'+String(uid).padStart(3,'0'),username:sname.toLowerCase().replace(' ','.'),password:'student123',role:'student',name:sname,classId:cls.id,rollNo:si+1,dob:'200'+(10-ci)+'-'+String(3+si*2).padStart(2,'0'),gender:gn[si],parentName:'Mr. '+sname.split(' ')[1],parentPhone:'9'+String(Math.floor(Math.random()*900000000+100000000))});uid++})});
  const tt=[],sids=subjects.map(s=>s.id),days=['Mon','Tue','Wed','Thu','Fri'];
  classes.forEach(cls=>{days.forEach(day=>{for(let p=1;p<=6;p++)tt.push({id:gI(),classId:cls.id,day,period:p,subjectId:sids[(p+days.indexOf(day)*3+classes.indexOf(cls))%sids.length]})})});
  const att=[],students=users.filter(u=>u.role==='student');let d=new Date();d.setDate(d.getDate()-35);
  for(let i=0;i<25;i++){d.setDate(d.getDate()+1);if(d.getDay()===0||d.getDay()===6)continue;const ds=d.toISOString().split('T')[0];students.forEach(st=>{const r=Math.random();att.push({id:gI(),date:ds,classId:st.classId,studentId:st.id,status:r<.82?'present':r<.94?'absent':'late'})})}
  const grades=[];
  ['Mid-Term','Unit Test 1'].forEach(exam=>{students.forEach(st=>{subjects.forEach(sub=>{const mx=exam==='Mid-Term'?100:25;grades.push({id:gI(),studentId:st.id,classId:st.classId,subjectId:sub.id,examType:exam,marks:Math.floor(Math.random()*(mx*.55)+mx*.4),maxMarks:mx})})})});

  $('lt').textContent='Writing to Firestore...';
  const cs=400;
  for(let i=0;i<users.length;i+=cs){const b=db.batch();users.slice(i,i+cs).forEach(u=>{const{id,...d}=u;b.set(db.collection('users').doc(id),d)});await b.commit()}
  let b=db.batch();subjects.forEach(s=>{const{id,...d}=s;b.set(db.collection('subjects').doc(id),d)});await b.commit();
  b=db.batch();classes.forEach(c=>{const{id,...d}=c;b.set(db.collection('classes').doc(id),d)});await b.commit();
  for(let i=0;i<tt.length;i+=cs){b=db.batch();tt.slice(i,i+cs).forEach(t=>{const{id,...d}=t;b.set(db.collection('timetable').doc(id),d)});await b.commit()}
  for(let i=0;i<att.length;i+=cs){b=db.batch();att.slice(i,i+cs).forEach(a=>{const{id,...d}=a;b.set(db.collection('attendance').doc(id),d)});await b.commit()}
  for(let i=0;i<grades.length;i+=cs){b=db.batch();grades.slice(i,i+cs).forEach(g=>{const{id,...d}=g;b.set(db.collection('grades').doc(id),d)});await b.commit()}
  CA.s('users',users);CA.s('subjects',subjects);CA.s('classes',classes);CA.s('timetable',tt);CA.s('attendance',att);CA.s('grades',grades);
  await FS.mi();
}

// INIT
async function init(){
  try{
    $('lt').textContent='Step 1: Checking SDK...';
    if(typeof firebase==='undefined') throw new Error('Firebase SDK not loaded. Check internet or ad blocker.');
    $('lt').textContent='Step 2: Checking config...';
    if(!firebaseConfig.projectId || firebaseConfig.projectId.includes('PLACEHOLDER')) throw new Error('Firebase config is PLACEHOLDER. Replace lines 21-26 with your real config from Firebase Console > Project Settings > Your Apps.');
    $('lt').textContent='Step 3: Connecting...';
    const testDoc = await db.collection('_meta').doc('init').get();
    if(!testDoc.exists || !testDoc.data().done){await seedDB()} else {$('lt').textContent='Loading data...';await lC()}
    $('lt').textContent='Ready!';
    if(Au.restore()) eA(); else $('ls').style.display='';
    setTimeout(()=>{$('lo').classList.add('hd');setTimeout(()=>$('lo').style.display='none',300)},300);
  } catch(err){
    console.error('SPS ERROR:', err);
    $('lo').innerHTML='<div style="max-width:480px;text-align:center;padding:40px"><div style="width:64px;height:64px;border-radius:50%;background:#FEE2E2;display:flex;align-items:center;justify-content:center;margin:0 auto 20px"><i class="fas fa-exclamation-triangle" style="color:#EF4444;font-size:28px"></i></div><p style="font-size:18px;font-weight:700;color:#1E293B;margin-bottom:8px">Connection Failed</p><p style="font-size:13px;color:#64748B;margin-bottom:16px;line-height:1.6">'+err.message+'</p><div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:16px;margin:16px 0;text-align:left"><p style="font-size:12px;font-weight:700;color:#334155;margin-bottom:8px">Fix steps:</p><ol style="font-size:12px;color:#64748B;line-height:2;padding-left:16px"><li>Firebase Console > Project Settings > Your Apps</li><li>Click Web app > Copy firebaseConfig</li><li>Replace PLACEHOLDER in index.html lines 21-26</li><li>Firestore > Rules > allow read, write: if true</li><li>Save, push to GitHub, wait 2 min, refresh</li></ol></div><button onclick="location.reload()" style="padding:12px 32px;border-radius:10px;background:#0D9488;color:white;border:none;font-size:14px;font-weight:600;cursor:pointer">Retry</button></div>';
  }
}
